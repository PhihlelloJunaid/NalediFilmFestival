<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/yellow.jpg" type="image/jpg">
    <title>NALEDI FILM FESTIVAL</title>
    <style>
        /* CSS Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .page {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1rem;
            width: 100%;
        }

        .logo-img {
            width: calc(250px + 75px + 75px); /* Original width + 2cm (75px) on each side */
            max-width: 90%; /* Ensure it doesn't overflow on mobile */
            height: auto;
            margin: 0 -75px; /* Negative margin to extend beyond container */
            object-fit: contain;
        }

        .logo-text {
            font-size: 3.5rem;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 15px;
        }

        .date-location {
            font-size: 1.8rem;
            margin-bottom: 3rem;
            text-align: center;
            line-height: 1.4;
        }

        /* ... (rest of your existing CSS remains the same) ... */

        @media (max-width: 768px) {
            .logo-text {
                font-size: 2.5rem;
            }

            .logo-img {
                width: calc(180px + 40px + 40px); /* Smaller base + reduced extension */
                margin: 0 -40px; /* Smaller negative margin on mobile */
            }

            h2 {
                font-size: 1.8rem;
            }

            h3 {
                font-size: 1.5rem;
            }

            .date-location {
                font-size: 1.3rem;
            }

            .content {
                padding: 10px;
            }

            .btn-container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
<!-- Navigation Dots -->
<div class="nav-dots">
    <div class="dot active" data-page="0"></div>
    <div class="dot" data-page="1"></div>
    <div class="dot" data-page="2"></div>
</div>

<!-- Page 1: Hero Section -->
<div class="page" id="page1">
    <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80" alt="Film Festival Background" class="bg-image">
    <div class="logo-container">
        <img src="images/yellow.jpg" alt="Naledi Film Festival Logo" class="logo-img">
        <div class="logo-text">Naledi Film Festival</div>
    </div>
    <div class="date-location">08-09 August 2025<br>VRYBURG, North West Province</div>
    <div class="btn-container">
        <button class="btn" onclick="window.open('https://docs.google.com/forms/d/1gAvn7bqWXpxw6kKZiqJaRpp2T7N5IAsMg7id_aapWJw/viewform?edit_requested=true', '_blank')">Submit Film</button>
        <button class="btn btn-outline" onclick="scrollToPage(1)">Learn More</button>
    </div>
</div>

<!-- ... (rest of your existing HTML remains the same) ... -->

<script>
    // JavaScript for smooth scrolling and navigation
    document.addEventListener('DOMContentLoaded', function() {
        const pages = document.querySelectorAll('.page');
        const dots = document.querySelectorAll('.dot');
        let currentPage = 0;
        let isScrolling = false;

        // Initialize scroll snapping
        window.addEventListener('wheel', handleScroll, { passive: false });
        window.addEventListener('touchmove', handleScroll, { passive: false });

        // Dot navigation click events
        dots.forEach(dot => {
            dot.addEventListener('click', function() {
                const pageIndex = parseInt(this.getAttribute('data-page'));
                scrollToPage(pageIndex);
            });
        });

        function handleScroll(e) {
            if (isScrolling) return;

            e.preventDefault();

            // Determine scroll direction
            let delta;
            if (e.type === 'wheel') {
                delta = e.deltaY > 0 ? 1 : -1;
            } else if (e.type === 'touchmove') {
                delta = e.touches[0].clientY < startY ? 1 : -1;
            }

            const newPage = currentPage + delta;

            // Boundary checks
            if (newPage >= 0 && newPage < pages.length) {
                scrollToPage(newPage);
            }
        }

        function scrollToPage(pageIndex) {
            isScrolling = true;
            currentPage = pageIndex;

            // Scroll to the page
            pages[pageIndex].scrollIntoView({
                behavior: 'smooth'
            });

            // Update active dot
            dots.forEach((dot, index) => {
                if (index === pageIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });

            // Reset scrolling flag after animation completes
            setTimeout(() => {
                isScrolling = false;
            }, 1000);
        }

        // Touch events for mobile
        let startY;
        document.addEventListener('touchstart', function(e) {
            startY = e.touches[0].clientY;
        }, { passive: true });
    });

    // Make scrollToPage available globally for button clicks
    window.scrollToPage = function(pageIndex) {
        const pages = document.querySelectorAll('.page');
        let currentPage = 0;
        let isScrolling = false;

        if (pageIndex >= pages.length) return;

        isScrolling = true;
        currentPage = pageIndex;

        pages[pageIndex].scrollIntoView({
            behavior: 'smooth'
        });

        document.querySelectorAll('.dot').forEach((dot, index) => {
            if (index === pageIndex) {
                dot.classList.add('active');
            } else {
                dot.classList.remove('active');
            }
        });

        setTimeout(() => {
            isScrolling = false;
        }, 1000);
    };
</script>
</body>
</html>
